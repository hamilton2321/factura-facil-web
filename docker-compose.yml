version: '3.8'

services:
  web:
    build: .
    container_name: factura-facil-web
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.facturafacil.rule=Host(`facturafacilco.cloud`) || Host(`www.facturafacilco.cloud`)"
      - "traefik.http.routers.facturafacil.entrypoints=websecure"
      - "traefik.http.routers.facturafacil.tls=true"
      - "traefik.http.routers.facturafacil.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.facturafacil.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_network}
