version: '3.8'

services:
  web:
    build: .
    container_name: factura-facil-landing
    restart: unless-stopped
    networks:
      - twenty-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.facturafacil.entrypoints=websecure"
      - "traefik.http.routers.facturafacil.rule=Host(`facturafacilco.cloud`) || Host(`www.facturafacilco.cloud`)"
      - "traefik.http.routers.facturafacil.tls.certresolver=letsencrypt"
      - "traefik.http.services.facturafacil.loadbalancer.server.port=80"

networks:
  twenty-net:
    external: true
